name: Cloull CI

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloull-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Print toolchain versions
        run: |
          node --version
          bun --version
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: TypeScript validation
        run: bun run lint
      - name: Build production bundle
        run: bun run build
      - name: Verify generated application
        run: |
          test -s dist/index.html
          test -d dist/assets
          grep -Eq 'assets/.*\\.js' dist/index.html
          ! grep -q '/src/main.tsx' dist/index.html
